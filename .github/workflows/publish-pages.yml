name: Publish ETNIKA project and site

on:
  push:
    branches: [main]
    # Rebuild Pages only when deployed content or this workflow changes.
    paths:
      - 'site/**'
      - 'data/**'
      - 'docs/**'
      - 'index.html'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: etnika-github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          set -eu
          mkdir -p _site/site
          cp index.html _site/index.html
          cp site/index.html _site/site/index.html
          cp site/etnika-map.css site/etnika-map.js _site/site/
          cp -R site/assets _site/site/
          cp -R data docs _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/site/index.html
          test -s _site/data/project.json
          test "$(find _site/site -maxdepth 1 -name '*.html' | wc -l)" -eq 1
          echo 'Prepared exactly one ETNIKA site: site/index.html'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
