name: Publish ETNIKA project and site

on:
  push:
    branches: [main]
    # Rebuild Pages only when deployed content or this workflow changes.
    paths:
      - 'site/**'
      - 'scripts/verify_live_hero.py'
      - 'data/**'
      - 'docs/**'
      - 'index.html'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keep the Pages deployment independent of the slow browser QA job.
# The previous workflow held this lock while installing Chromium and made
# newer site builds cancel each other before they could publish.
jobs:
  deploy:
    concurrency:
      group: etnika-github-pages-deploy-stable-v3
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          set -eu
          mkdir -p _site/site
          cp index.html _site/index.html
          cp site/index.html _site/site/index.html
          cp site/etnika-map.css site/etnika-map.js _site/site/
          cp site/prices-v3.css site/prices-v3.js _site/site/
          cp -R site/assets _site/site/
          test -s _site/site/prices-v3.css
          test -s _site/site/prices-v3.js
          cp -R data docs _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/site/index.html
          test -s _site/data/project.json
          test "$(find _site/site -maxdepth 1 -name '*.html' | wc -l)" -eq 1
          echo 'Prepared exactly one ETNIKA site: site/index.html'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: Verify published site (non-blocking)
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Chromium for public-site verification
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium

      - name: Verify published pricing composition, navigation and tariff interactions
        run: python3 scripts/verify_live_prices.py

      - name: Verify the published first screen on desktop and mobile
        run: python3 scripts/verify_live_hero.py

      - name: Upload actual published-site screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etnika-live-hero
          path: |
            reports/etnika-live-first-screen-*.png
            reports/etnika-live-prices-*.png
          if-no-files-found: ignore

