name: Publish ETNIKA project and site

on:
  push:
    branches: [main]
    # Rebuild Pages only when deployed content or this workflow changes.
    paths:
      - 'site/**'
      - 'scripts/verify_live_hero.py'
      - 'scripts/verify_live_contacts.py'
      - 'data/**'
      - 'docs/**'
      - 'index.html'
      - '.github/workflows/publish-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Keep the Pages deployment independent of the slow browser QA job.
# The previous workflow held this lock while installing Chromium and made
# newer site builds cancel each other before they could publish.
jobs:
  deploy:
    concurrency:
      group: etnika-github-pages-deploy-stable-v3
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          set -eu
          mkdir -p _site/site
          cp index.html _site/index.html
          cp site/index.html _site/site/index.html
          cp site/tariffs-draft.html _site/site/tariffs-draft.html
          cp site/stories-variants.html _site/site/stories-variants.html
          cp site/etnika-map.css site/etnika-map.js _site/site/
          cp site/prices-v3.css site/prices-v3.js _site/site/
          cp -R site/assets _site/site/
          test -s _site/site/prices-v3.css
          test -s _site/site/prices-v3.js
          cp -R data docs _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/site/index.html
          test -s _site/data/project.json
          test -s _site/site/tariffs-draft.html
          grep -q 'noindex,nofollow' _site/site/tariffs-draft.html
          test -s _site/site/stories-variants.html
          grep -q 'noindex,nofollow' _site/site/stories-variants.html
          test "$(find _site/site -maxdepth 1 -name '*.html' | wc -l)" -eq 3
          echo 'Prepared canonical ETNIKA site and isolated tariff draft'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      # The Actions artifact listing is eventually consistent; deploying in
      # the same instant as upload can misleadingly report zero artifacts.
      - name: Wait for Pages artifact indexing
        run: sleep 20

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-live:
    name: Verify published site (non-blocking)
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify published tariff draft matches source
        run: |
          set -eu
          url='https://nkuchenov-hash.github.io/etnika-website/site/tariffs-draft.html'
          for attempt in 1 2 3 4 5 6; do
            if curl -fsSL --max-time 20 -H 'Cache-Control: no-cache' "$url?build=${GITHUB_SHA}" -o /tmp/live-tariffs.html && cmp -s site/tariffs-draft.html /tmp/live-tariffs.html; then
              echo 'Published tariff draft matches source'
              exit 0
            fi
            sleep 10
          done
          echo 'Published tariff draft unavailable or stale' >&2
          exit 1

      - name: Install Chromium for public-site verification
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium

      - name: Verify exact published About build and complete content
        run: python3 scripts/validate_about_series.py --live

      - name: Upload published About screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etnika-live-about
          path: reports/etnika-about-reference-*
          if-no-files-found: ignore

      - name: Verify published final process block
        run: python3 scripts/validate_process_final.py --live

      - name: Upload final process screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etnika-process-final
          path: reports/etnika-process-final-*.png
          if-no-files-found: ignore

      - name: Verify live contacts spacing and removed schematic caption
        run: python3 scripts/verify_live_contacts.py

      - name: Verify published pricing composition, navigation and tariff interactions
        run: python3 scripts/verify_live_prices.py

      - name: Verify the published first screen on desktop and mobile
        run: python3 scripts/verify_live_hero.py

      - name: Upload actual published-site screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etnika-live-hero
          path: |
            reports/etnika-live-first-screen-*.png
            reports/etnika-live-prices-*.png
            reports/etnika-live-contacts-*.png
          if-no-files-found: ignore

