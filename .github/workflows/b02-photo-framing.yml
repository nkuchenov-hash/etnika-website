name: Verify LIVE uncropped B02 photographs
on:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/assets/b02/framed/**'
      - 'scripts/verify_live_b02_photo_framing.py'
      - '.github/workflows/b02-photo-framing.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install verification dependencies
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0 pillow==11.3.0
          command -v google-chrome || command -v google-chrome-stable
      - name: Verify published images and framing
        run: python3 scripts/verify_live_b02_photo_framing.py
      - name: Save all eight slide captures on desktop and mobile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etnika-unique-b02-photo-framing-review
          path: reports/b02-framing/*.png
          if-no-files-found: ignore
