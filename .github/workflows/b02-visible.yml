name: Fast B02 visible-on-scroll regression
on:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'scripts/validate_b02_visible_on_scroll.py'
      - '.github/workflows/b02-visible.yml'
  workflow_dispatch:
# Stale QA runs should never delay the site deployment.
concurrency:
  group: etnika-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  b02-visible:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright without apt browser downloads
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          command -v google-chrome || command -v google-chrome-stable
      - name: Check second block at natural scroll offsets
        run: python3 scripts/validate_b02_visible_on_scroll.py
      - name: Save visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etnika-b02-owner-screenshot-check
          path: reports/etnika-b02-owner-*.png
          if-no-files-found: ignore
