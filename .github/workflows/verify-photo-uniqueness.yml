name: Verify PUBLISHED ETNIKA photo uniqueness
on:
  push:
    branches: [main]
    paths:
      - 'scripts/verify_etnika_photo_uniqueness.py'
      - '.github/workflows/verify-photo-uniqueness.yml'
  workflow_dispatch:
jobs:
  photo-uniqueness:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Prepare browser
        run: |
          python3 -m pip install playwright==1.56.0
          command -v google-chrome || command -v google-chrome-stable
      - name: Verify published gallery
        run: python3 scripts/verify_etnika_photo_uniqueness.py
      - name: Save website proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: b02-exclusive-photos-screenshots
          path: reports/b02-exclusive-eight-photos-*.png
          if-no-files-found: ignore
