name: Verify complete About editorial spread
on:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'site/assets/b02/series/**'
      - 'scripts/validate_about_series.py'
      - '.github/workflows/about-series.yml'
  workflow_dispatch:
jobs:
  visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --disable-pip-version-check playwright==1.56.0
      - run: python3 scripts/validate_about_series.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etnika-about-reference-screenshots
          path: |
            reports/etnika-about-reference-*.png
            reports/etnika-about-reference-*.json
          if-no-files-found: error
