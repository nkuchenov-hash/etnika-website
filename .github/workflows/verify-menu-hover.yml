name: Verify ETNIKA menu contrast and hover
on:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'scripts/validate_menu_hover.py'
      - '.github/workflows/verify-menu-hover.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-menu:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Check desktop dark/light text and hover, then mobile dropdown
        run: python3 scripts/validate_menu_hover.py
