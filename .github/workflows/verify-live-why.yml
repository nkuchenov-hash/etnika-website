name: Verify PUBLISHED ETNIKA Why section
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/verify_live_why.py'
      - '.github/workflows/verify-live-why.yml'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/index.html'
      - 'scripts/verify_live_why.py'
      - '.github/workflows/verify-live-why.yml'

concurrency:
  group: etnika-live-why-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright API (use runner Chrome)
        run: python3 -m pip install --disable-pip-version-check playwright==1.56.0
      - name: Verify rendered PUBLIC site, not local source
        run: python3 scripts/verify_live_why.py
      - name: Upload actual public-site screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etnika-why-LIVE
          path: reports/etnika-why-LIVE-*.png
          if-no-files-found: ignore
