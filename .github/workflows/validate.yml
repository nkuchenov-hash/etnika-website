name: Validate ETNIKA project
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Stale QA runs should never delay the site deployment.
concurrency:
  group: etnika-qa-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog, shared statuses, and dashboard JavaScript
        run: |
          python3 - <<'PYTEST'
          import json, pathlib, subprocess
          catalog=json.loads(pathlib.Path('data/project.json').read_text(encoding='utf-8'))
          state=json.loads(pathlib.Path('data/state.json').read_text(encoding='utf-8'))
          assert len(catalog.get('blocks', [])) >= 12, 'Expected site blocks'
          task_ids={task['id'] for block in catalog['blocks'] for task in block['tasks']}
          assert set(state['tasks']).issubset(task_ids), 'Unknown task status IDs'
          every=[t for b in catalog['blocks'] for t in b['tasks']]
          assert len(every)==len(task_ids), 'A task must have one owning block'
          allowed_modes={'change','decision','qa','archive'}
          for task in every:
            plan=task.get('plan',{})
            assert plan.get('mode') in allowed_modes, f"Missing task class: {task['id']}"
            assert all(isinstance(plan.get(k),str) and len(plan[k].strip())>=20 for k in ('essence','action','outcome')), f"Task needs concrete essence/action/outcome: {task['id']}"
            assert plan['action']==task['text'] and plan['outcome']==task['acceptance'], f"Task plan differs from visible fields: {task['id']}"
            assert 'Проверено в HTML-превью и на опубликованной Tilda' not in plan['outcome'], f"Generic acceptance: {task['id']}"
          assert sum(t['plan']['mode']=='archive' for t in every)==0, 'Old audit tasks must not appear in active backlog'

          assert len(every)==catalog['allTasks'], 'Wrong active task count'
          assert all(t.get('chat',{}).get('quote') and t['chat'].get('author') and (t['chat'].get('page') or t['chat'].get('sourceKind')=='user-ChatGPT-direct') for t in every), 'Active task without a primary chat message'
          assert all(t.get('source','').startswith(('Telegram PDF,','ChatGPT,')) for t in every), 'Tasks must come from Telegram or the owner ChatGPT comments, not HTML audit'
          assert all(t.get('evidence',{}).get('quote')==t.get('chat',{}).get('quote') for t in every), 'Primary quote mismatch'
          assert len({t['id'] for t in every})==len(every), 'Duplicate chat task ID'
          assert catalog.get('meta',{}).get('taskSourcePolicy','').startswith('ACTIVE BLOCK TASKS ONLY FROM DIRECT CHAT'), 'Task source policy regressed'
          assert all(t.get('evidence',{}).get('status') for t in every), 'Missing source audit'
          assert all(t['evidence'].get('quote') for t in every if t['evidence']['status']=='Прямая реплика'), 'Missing direct quote'
          assert all(set(b.get('relatedTaskIds',[]))<=task_ids for b in catalog['blocks']), 'Bad cross-reference'
          import re
          m=re.search(r'<script id="project-data" type="application/json">(.*?)</script>',pathlib.Path('index.html').read_text(encoding='utf-8'),re.S)
          assert m and json.loads(m.group(1))==catalog, 'Embedded catalog out of sync'
          
          accepted={'Не начато','В работе','На проверке','Заблокировано','Готово','Неактуально'}
          assert set(state['tasks'].values()).issubset(accepted), 'Unknown status value'
          assert pathlib.Path('site/index.html').is_file(), 'Site source missing'
          from html.parser import HTMLParser
          site_paths=list(pathlib.Path('site').glob('*.html'))
          assert [p.name for p in site_paths]==['index.html'], 'Only site/index.html may define the site'
          canonical=site_paths[0].read_text(encoding='utf-8')
          assert canonical.count('id="etnika-hero"')==1, 'Canonical site must have one HERO'
          assert 'const ids=[' in canonical, 'Page section ordering is missing'
          section_order=canonical.split('const ids=[',1)[1].split(']',1)[0]
          display_ids=re.findall(r"'([^']+)'",section_order)
          assert display_ids[0]=='etnika-hero', 'HERO must be the first visible section'
          assert display_ids[1:4]==['etnika-block-02-final','etnika-space-photo','etnika-stories'], 'First content blocks must be B02, space, stories'
          assert display_ids.index('etnika-hero')<display_ids.index('etnika-process-interactive'), 'Process must follow HERO'
          assert len(display_ids)==len(set(display_ids)), 'Duplicate section IDs in runtime order'
          assert '#etnika-faq{\n  --paper:#f3f0eb !important;' in canonical, 'Before visit background mismatch'
          ids=('etnika-hero','etnika-stories','etnika-space-photo','etnika-studio-features','etnika-block-02-final','etnika-process-interactive','etnika-faq','etnika-prices-clear','etnika-extra','etnika-faq-tariffs','etnika-gift','etnika-contacts-source')
          assert all('id="'+v+'"' in canonical for v in ids), 'Canonical site content lost'
          assert 'assets/etnika-portrait-dark.jpg' in canonical, 'Site photo missing'
          for asset in ('etnika-portrait-beige.jpg','etnika-portrait-dark.jpg','etnika-portrait-etnika.jpg','etnika-bw-portrait.jpg','etnika-bw-guest.jpg','etnika-studio.jpg'):
            assert pathlib.Path('site/assets/'+asset).is_file(), 'Photo asset missing: '+asset
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          js=html.rsplit('<script>',1)[1].split('</script>',1)[0]
          assert 'data/state.json?' in js, 'Dashboard must read GitHub statuses'
          assert 'localStorage' not in js, 'Browser-only statuses are forbidden'
          tmp=pathlib.Path('/tmp/etnika-dashboard.js')
          tmp.write_text(js,encoding='utf-8')
          subprocess.run(['node','--check',str(tmp)],check=True)
          from html.parser import HTMLParser
          import re
          site=pathlib.Path('site/index.html').read_text(encoding='utf-8')
          class SiteParser(HTMLParser):
            def __init__(self):
              super().__init__()
              self.ids=[];self.anchors=[];self.sections=0;self.img_without_alt=0
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if a.get('id'): self.ids.append(a['id'])
              if tag=='a' and (a.get('href') or '').startswith('#') and a.get('href')!='#':
                self.anchors.append(a['href'][1:])
              if tag=='section':self.sections+=1
              if tag=='img' and 'alt' not in a:self.img_without_alt+=1
          p=SiteParser();p.feed(site)
          assert len(p.ids)==len(set(p.ids)), 'Duplicate site IDs'
          assert not (set(p.anchors)-set(p.ids)), 'Broken internal anchors: '+str(sorted(set(p.anchors)-set(p.ids)))
          assert p.sections>=12, 'Expected 12 site sections'
          assert p.img_without_alt==0, 'Image missing alt'
          inline=re.findall(r'<script\b[^>]*>(.*?)</script>',site,re.I|re.S)
          for i,code in enumerate(inline):
            if not code.strip(): continue
            tmp.write_text(code,encoding='utf-8')
            subprocess.run(['node','--check',str(tmp)],check=True)
          print('Static site audit:',p.sections,'sections,',len(inline),'inline JS blocks,',len(p.anchors),'internal links')
          print('Blocks:',len(catalog['blocks']),'Tasks:',len(task_ids),'Shared status records:',len(state['tasks']))
          PYTEST

      - name: Check working/preview gallery parity and shared design-system tokens
        run: python3 scripts/validate_space_block.py

      - name: Prepare Chromium for layout regression
        run: |
          python3 -m pip install --disable-pip-version-check playwright==1.56.0 Pillow==11.3.0
          python3 -m playwright install --with-deps chromium

      - name: Check gift certificate content fits visible screen at desktop and mobile sizes
        run: python3 scripts/validate_gift_fit.py

      - name: Check FAQ outer rules and balanced gray-line spacing
        run: python3 scripts/validate_faq_lines.py

      - name: Check viewport geometry and photo visibility in Chromium
        run: python3 scripts/validate_space_block.py --render

      - name: Check B02/SPACE horizontal guides and first-screen content fit
        run: python3 scripts/validate_b02_space_guides.py

      - name: Check site navigation and shared editorial type
        run: python3 scripts/validate_site_header.py --render

      - name: Check WHY ETNIKA photo, caption, and six-item viewport geometry
        run: python3 scripts/validate_why_section.py

      - name: Save layout screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etnika-studio-space-layout
          path: |
            reports/etnika-space-*.png
            reports/etnika-b02-space-guides-*.png
            reports/etnika-why-*.png
            reports/etnika-faq-lines-*.png
            reports/etnika-gift-*.png
          if-no-files-found: ignore
