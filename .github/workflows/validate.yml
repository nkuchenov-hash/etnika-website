name: Validate ETNIKA project
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog, shared statuses, and dashboard JavaScript
        run: |
          python3 - <<'PYTEST'
          import json, pathlib, subprocess
          catalog=json.loads(pathlib.Path('data/project.json').read_text(encoding='utf-8'))
          state=json.loads(pathlib.Path('data/state.json').read_text(encoding='utf-8'))
          assert len(catalog.get('blocks', [])) >= 12, 'Expected site blocks'
          task_ids={task['id'] for block in catalog['blocks'] for task in block['tasks']}
          assert set(state['tasks']).issubset(task_ids), 'Unknown task status IDs'
          every=[t for b in catalog['blocks'] for t in b['tasks']]
          assert len(every)==len(task_ids), 'A task must have one owning block'
          allowed_modes={'change','decision','qa','archive'}
          for task in every:
            plan=task.get('plan',{})
            assert plan.get('mode') in allowed_modes, f"Missing task class: {task['id']}"
            assert all(isinstance(plan.get(k),str) and len(plan[k].strip())>=20 for k in ('essence','action','outcome')), f"Task needs concrete essence/action/outcome: {task['id']}"
            assert plan['action']==task['text'] and plan['outcome']==task['acceptance'], f"Task plan differs from visible fields: {task['id']}"
            assert 'Проверено в HTML-превью и на опубликованной Tilda' not in plan['outcome'], f"Generic acceptance: {task['id']}"
          assert sum(t['plan']['mode']=='archive' for t in every)==0, 'Old audit tasks must not appear in active backlog'

          assert len(every)==catalog['allTasks'], 'Wrong active task count'
          assert all(t.get('chat',{}).get('quote') and t['chat'].get('author') and t['chat'].get('page') for t in every), 'Active block task without a primary Telegram message'
          assert all(t.get('source','').startswith('Telegram PDF,') for t in every), 'HTML audits must not create active tasks'
          assert all(t.get('evidence',{}).get('quote')==t.get('chat',{}).get('quote') for t in every), 'Primary quote mismatch'
          assert len({t['id'] for t in every})==len(every), 'Duplicate chat task ID'
          assert catalog.get('meta',{}).get('taskSourcePolicy','').startswith('ACTIVE BLOCK TASKS ONLY FROM DIRECT CHAT'), 'Task source policy regressed'
          assert all(t.get('evidence',{}).get('status') for t in every), 'Missing source audit'
          assert all(t['evidence'].get('quote') for t in every if t['evidence']['status']=='Прямая реплика'), 'Missing direct quote'
          assert all(set(b.get('relatedTaskIds',[]))<=task_ids for b in catalog['blocks']), 'Bad cross-reference'
          import re
          m=re.search(r'<script id="project-data" type="application/json">(.*?)</script>',pathlib.Path('index.html').read_text(encoding='utf-8'),re.S)
          assert m and json.loads(m.group(1))==catalog, 'Embedded catalog out of sync'
          
          accepted={'Не начато','В работе','На проверке','Заблокировано','Готово','Неактуально'}
          assert set(state['tasks'].values()).issubset(accepted), 'Unknown status value'
          assert pathlib.Path('site/index.html').is_file(), 'Site source missing'
          html=pathlib.Path('index.html').read_text(encoding='utf-8')
          js=html.rsplit('<script>',1)[1].split('</script>',1)[0]
          assert 'data/state.json?' in js, 'Dashboard must read GitHub statuses'
          assert 'localStorage' not in js, 'Browser-only statuses are forbidden'
          tmp=pathlib.Path('/tmp/etnika-dashboard.js')
          tmp.write_text(js,encoding='utf-8')
          subprocess.run(['node','--check',str(tmp)],check=True)
          from html.parser import HTMLParser
          import re
          site=pathlib.Path('site/index.html').read_text(encoding='utf-8')
          class SiteParser(HTMLParser):
            def __init__(self):
              super().__init__()
              self.ids=[];self.anchors=[];self.sections=0;self.img_without_alt=0
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if a.get('id'): self.ids.append(a['id'])
              if tag=='a' and (a.get('href') or '').startswith('#') and a.get('href')!='#':
                self.anchors.append(a['href'][1:])
              if tag=='section':self.sections+=1
              if tag=='img' and 'alt' not in a:self.img_without_alt+=1
          p=SiteParser();p.feed(site)
          assert len(p.ids)==len(set(p.ids)), 'Duplicate site IDs'
          assert not (set(p.anchors)-set(p.ids)), 'Broken internal anchors: '+str(sorted(set(p.anchors)-set(p.ids)))
          assert p.sections>=12, 'Expected 12 site sections'
          assert p.img_without_alt==0, 'Image missing alt'
          inline=re.findall(r'<script\b[^>]*>(.*?)</script>',site,re.I|re.S)
          for i,code in enumerate(inline):
            if not code.strip(): continue
            tmp.write_text(code,encoding='utf-8')
            subprocess.run(['node','--check',str(tmp)],check=True)
          print('Static site audit:',p.sections,'sections,',len(inline),'inline JS blocks,',len(p.anchors),'internal links')
          print('Blocks:',len(catalog['blocks']),'Tasks:',len(task_ids),'Shared status records:',len(state['tasks']))
          PYTEST
