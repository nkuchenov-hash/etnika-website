name: Inspect original ETNIKA footer (temporary)
on:
  push:
    paths:
      - '.github/workflows/inspect-footer-source.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch published Tilda homepage and extract footer structure
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4 requests
          python - <<'PY'
          import requests, re, json
          from bs4 import BeautifulSoup, NavigableString
          u='https://etnika-studio.ru/'
          r=requests.get(u,timeout=35,headers={'User-Agent':'Mozilla/5.0'})
          print('HTTP',r.status_code,'BYTES',len(r.content),'URL',r.url,flush=True)
          r.raise_for_status()
          html=r.text
          soup=BeautifulSoup(html,'html.parser')
          print('HEAD',repr(html[:2500]),'SOUP_TEXT',repr(soup.get_text(' ',strip=True)[:900]),'TITLE',str(soup.title),'RECS',len(soup.select('[id^=rec]')),'HOST',r.headers.get('server'))
          needles=['Политика конфиденциальности','Согласие на обработку персональных','Договор-оферта','ОГРНИП','РАЗДЕЛЫ САЙТА','студия автопортрета']
          seen=set()
          for needle in needles:
            nodes=soup.find_all(string=lambda t:t is not None and needle.casefold() in str(t).casefold())
            print('NEEDLE',needle,'NODES',len(nodes))
            for node in nodes[-4:]:
              rec=node.find_parent('div',id=re.compile(r'^rec\d+'))
              if not rec: continue
              rid=rec.get('id')
              if rid in seen: continue
              seen.add(rid)
              print('REC_START',rid,'CLASS',rec.get('class'),'HTML_LENGTH',len(str(rec)))
              print('REC_TEXT',repr(rec.get_text(' ',strip=True)[:5000]))
              print('REC_HTML_START')
              print(str(rec)[:32000])
              print('REC_HTML_END')
          print('REC_TOTAL',len(seen),sorted(seen))
          for rid in sorted(seen):
            for sty in soup.find_all('style'):
              css=sty.string or sty.get_text() or ''
              if '#'+rid in css or 'rec'+rid in css:
                print('STYLE_START',rid,'LENGTH',len(css))
                print(css[:22000])
                print('STYLE_END',rid)
          PY
      - name: Inspect browser-rendered public page
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install chromium
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,args=['--no-sandbox'])
              page=browser.new_page(viewport={'width':1440,'height':900},locale='ru-RU')
              try:
                  res=page.goto('https://etnika-studio.ru/',wait_until='domcontentloaded',timeout=30000)
                  page.wait_for_timeout(9000)
                  print('BROWSER_HTTP',res.status if res else '-','TITLE',page.title(),'URL',page.url,'BODYLEN',len(page.locator('body').inner_text()))
                  print('BROWSER_TEXT_END',repr(page.locator('body').inner_text()[-2300:]))
                  print('BROWSER_REC_COUNT',page.locator('[id^="rec"]').count())
                  for needle in ['Политика конфиденциальности','РАЗДЕЛЫ САЙТА','ОГРНИП','Контакты','ЭТНИКА']:
                      el=page.get_by_text(needle,exact=False).last
                      if el.count():
                          print('METRIC',needle,el.evaluate("""el=>({text:el.innerText?.slice(0,100),rect:(()=>{let r=el.getBoundingClientRect();return [r.x,r.y,r.width,r.height]})(),tag:el.tagName,class:el.className,style:(()=>{let s=getComputedStyle(el);return {color:s.color,fontFamily:s.fontFamily,fontSize:s.fontSize,fontWeight:s.fontWeight,lineHeight:s.lineHeight,background:s.backgroundColor,textAlign:s.textAlign}})(),parent:el.parentElement?.outerHTML.slice(0,300)})"""))
                  print('BOTTOM_SECTION',page.evaluate("""() => {let b=document.body;return [...b.children].slice(-9).map(x=>({tag:x.tagName,id:x.id,class:x.className,html:x.outerHTML.slice(0,250)}))}"""))
              except Exception as e:
                  print('BROWSER_ERROR',repr(e))
              browser.close()
          PY
