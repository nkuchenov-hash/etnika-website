const variants={1:[['individual',4,4],['date',4,2],['kids',4,4],['pregnancy',4,2],['art',5,3],['memories',3,3],['marketplace',4,3],['family',5,3],['portfolio',3,3],['business',4,3],['blog',3,3],['events',3,3],['friends',3,3],['birthday',3,3]],2:[['individual',5,.79,0],['date',3,.76,70],['kids',4,.78,15],['portfolio',3,.73,0],['family',5,1.02,65],['pregnancy',4,.78,0],['blog',4,.82,35],['business',3,.70,0],['art',5,1.12,75],['marketplace',3,.74,0],['memories',5,1.04,55],['events',4,.8,0],['friends',6,.98,0],['birthday',6,.98,40]],3:[['individual',3,.75],['date',3,.75],['kids',3,.75],['pregnancy',3,.75],['family',6,1.22],['art',6,1.22],['portfolio',3,.76],['blog',3,.76],['marketplace',3,.76],['business',3,.76],['memories',3,.76],['events',3,.76],['friends',3,.76],['birthday',3,.76]]};
const shapes={individual:[0,0,251,592],date:[262,0,223,271],kids:[495,0,258,380],pregnancy:[763,0,215,335],marketplace:[262,281,223,311],memories:[441,390,312,202],art:[763,345,215,247],portfolio:[0,602,216,296],family:[226,602,507,296],business:[743,602,235,296],blog:[0,908,239,316],events:[249,908,236,316],friends:[495,908,249,316],birthday:[754,908,224,316]};variants[4]=Object.keys(shapes).map(id=>[id,1,1]);
const preview=document.querySelector('.preview'),template=document.querySelector('#section').cloneNode(true),lb=document.querySelector('#lightbox'),names=['','01 · Мозаика','02 · Журнал','03 · Галерея','04 · Фигурная мозаика'];
function renderOne(v,section){const gallery=section.querySelector('.gallery');section.className='v'+v+' '+(v===2?'outside':'overlay');gallery.replaceChildren();for(const [id,c,r,o] of variants[v]){const name=lookup[id],f=document.createElement('figure');f.className='card';f.dataset.photo=id;if(['date','pregnancy','family','business','events','friends','birthday'].includes(id))f.style.setProperty('--pos','0%');f.tabIndex=0;f.setAttribute('role','button');f.setAttribute('aria-label',name);f.style.setProperty('--c',c);if(v===1)f.style.setProperty('--r',r);else f.style.setProperty('--ratio',r);if(o)f.style.setProperty('--offset',o+'px');if(v===4){const [x,y,w,h]=shapes[id];for(const [k,val,base] of [['x',x,978],['y',y,1224],['w',w,978],['h',h,1224]])f.style.setProperty('--'+k,(val/base*100)+'%');f.style.setProperty('--id',id)}const pic=document.createElement('div');pic.className='picture';const im=new Image();im.alt=name;im.loading='lazy';im.src=root+id+'.jpg';pic.append(im);const cap=document.createElement('figcaption');cap.textContent=name;const arrow=document.createElement('span');arrow.className='arrow';arrow.textContent='↗';cap.append(arrow);f.append(pic,cap);f.onclick=()=>openPhoto(im.src,name);f.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();f.click()}};gallery.append(f)}}
function render(v){preview.replaceChildren();preview.classList.toggle('compare',v===0);for(const n of(v===0?[1,2,3,4]:[v])){const section=template.cloneNode(true);section.id='variant-'+n;if(v===0){const label=document.createElement('p');label.className='variant-label';label.textContent=names[n];section.prepend(label)}preview.append(section);renderOne(n,section)}document.querySelectorAll('[data-v]').forEach(b=>{b.classList.toggle('active',+b.dataset.v===v);b.setAttribute('aria-pressed',+b.dataset.v===v)})}
function openPhoto(src,name){lb.querySelector('img').src=src;lb.querySelector('img').alt=name;lb.querySelector('p').textContent=name;lb.classList.add('open');lb.querySelector('button').focus()}function close(){lb.classList.remove('open')}lb.onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{render(+b.dataset.v);window.scrollTo(0,0)});let mode='desktop';function device(){preview.classList.toggle('mobile',mode==='mobile'||matchMedia('(max-width:720px)').matches);document.querySelectorAll('[data-d]').forEach(x=>{x.classList.toggle('active',x.dataset.d===mode);x.setAttribute('aria-pressed',x.dataset.d===mode)})}document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{mode=b.dataset.d;device();window.scrollTo(0,0)});matchMedia('(max-width:720px)').addEventListener('change',device);device();render(0);
