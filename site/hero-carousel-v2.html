<body>

</section>
<script id="etnika-carousel-js">
(function(){
  const hero=document.getElementById('etnika-hero');
  if(!hero||hero.dataset.carouselReady==='yes')return;
  hero.dataset.carouselReady='yes';
  const slides=Array.from(hero.querySelectorAll('.ec-slide'));
  const dots=Array.from(hero.querySelectorAll('.ec-dot'));
  const status=hero.querySelector('#etnika-slide-status');
  const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let current=0,timer=null,startX=null;
  const interval=Math.max(4500,Number(hero.dataset.autoplay)||7000);
  function select(index,announced){
    current=((index%slides.length)+slides.length)%slides.length;
    slides.forEach((slide,i)=>slide.classList.toggle('is-current',i===current));
    dots.forEach((dot,i)=>dot.setAttribute('aria-current',i===current?'true':'false'));
    hero.classList.toggle('is-light',slides[current].dataset.tone==='light');
    if(announced&&status)status.textContent='Фотография '+(current+1)+' из '+slides.length+': '+slides[current].dataset.name+'.';
  }
  function stop(){if(timer){window.clearInterval(timer);timer=null;}}
  function start(){stop();if(reduced||document.hidden)return;timer=window.setInterval(()=>select(current+1,false),interval)}
  dots.forEach((dot,i)=>dot.addEventListener('click',()=>{select(i,true);start()}));
  hero.addEventListener('pointerenter',stop);
  hero.addEventListener('pointerleave',start);
  hero.addEventListener('focusin',stop);
  hero.addEventListener('focusout',event=>{if(!hero.contains(event.relatedTarget))start()});
  hero.addEventListener('touchstart',event=>{startX=event.changedTouches[0].screenX;},{passive:true});
  hero.addEventListener('touchend',event=>{if(startX===null)return;const dx=event.changedTouches[0].screenX-startX;startX=null;if(Math.abs(dx)>55){select(current+(dx<0?1:-1),true);start()}},{passive:true});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)stop();else start()});
  select(0,false);start();
})();
</script>
