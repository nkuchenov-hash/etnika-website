(()=>{'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const packages={
 express:{name:'Экспресс',mins:'30 минут',people:'до 2 человек · больше — по согласованию',weekday:'2 900',weekend:'3 900',photo:'etnika-bw-portrait.jpg',kicker:'Быстрый формат',desc:'Для короткой индивидуальной съёмки, новых портретов или быстрого обновления контента.',features:['Базовый белый фон','Неограниченное число ч/б или цветных фотографий с цветокоррекцией','Портретная съёмка или фотографии в полный рост','Готовые фотографии в течение 24 часов','Гримёрная зона','Кулер с водой']},

function render(){const p=packages[plan];
 $$('.tariff-row').forEach(b=>{const active=b.dataset.plan===plan;b.setAttribute('aria-pressed',String(active));b.querySelector('.tariff-price').textContent=packages[b.dataset.plan][day]+' ₽';});
 $$('[data-day]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.day===day)));
 $('.panel-title').textContent=p.name;$('.panel-sub').textContent=p.mins+' · '+p.people;$('.panel-desc').textContent=p.desc;$('.panel-price').textContent=p[day]+' ₽';
 $('.feature-list').replaceChildren(...p.features.map(s=>{const li=document.createElement('li');li.textContent=s;return li;}));
 const photo=$('.portrait');if(photo){photo.src='../'+p.photo;photo.alt=p.name+' — съёмка в студии ЭТНИКА';$('.photo-kicker').textContent=p.kicker;$('.photo-name').textContent=p.name+' · '+p.mins;}
}
function layout(){const desktop=innerWidth>1020;overlay.setAttribute('aria-modal',String(!desktop));
 const priceRight=Math.max(...$$('.tariff-price').map(e=>e.getBoundingClientRect().right));
 const railStart=window.PREVIEW_WITH_PHOTO ? Math.max($('.photo-frame').getBoundingClientRect().left,priceRight+26) : Math.max(Math.round(innerWidth*.58),innerWidth>1300?Math.round(innerWidth*.56):0);
 const x=Math.min(innerWidth-370,railStart);document.documentElement.style.setProperty('--rail-width',Math.max(370,innerWidth-x)+'px');document.documentElement.style.setProperty('--rail-left',x+'px');
 if(desktop && !window.PREVIEW_WITH_PHOTO){document.documentElement.style.setProperty('--content-open-width',Math.max(520,x-parseFloat(getComputedStyle(main).paddingLeft)-30)+'px');}
}
function setOpen(yes){if(open===yes)return;open=yes;if(yes){lastFocus=document.activeElement;layout();document.body.classList.add('details-open');overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');infoBtn.setAttribute('aria-expanded','true');if(innerWidth<=1020){document.body.style.overflow='hidden';}closeBtn.focus();}else{document.body.classList.remove('details-open');overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');infoBtn.setAttribute('aria-expanded','false');document.body.style.overflow='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus();}}

})();
